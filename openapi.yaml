openapi: 3.0.3
info:
  title: Evolution API
  version: 2.3.7
  description: Operations exposed by evolution-go-mcp and verified against Evolution API v2.3.7.
servers:
  - url: http://localhost:8080
    description: Example only; replace with the base URL reachable from the adapter.
security:
  - EvolutionApiKey: []
tags:
  - name: Instances
  - name: Messages
  - name: Chats
paths:
  /instance/fetchInstances:
    get:
      operationId: instances
      tags: [Instances]
      summary: List instances
      responses:
        '200':
          description: Instances returned by Evolution API
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JsonObject'
        default:
          $ref: '#/components/responses/ApiError'
  /instance/create:
    post:
      operationId: create_instance
      tags: [Instances]
      summary: Create an instance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInstanceRequest'
      responses:
        '201':
          $ref: '#/components/responses/ApiResponse'
        default:
          $ref: '#/components/responses/ApiError'
  /instance/connect/{instance}:
    get:
      operationId: connect
      tags: [Instances]
      summary: Connect an instance or get its QR or pairing code
      parameters:
        - $ref: '#/components/parameters/InstanceName'
        - name: number
          in: query
          required: false
          description: Phone number for requesting a pairing code
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse'
        default:
          $ref: '#/components/responses/ApiError'
  /instance/connectionState/{instance}:
    get:
      operationId: status
      tags: [Instances]
      summary: Get instance connection state
      parameters:
        - $ref: '#/components/parameters/InstanceName'
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse'
        default:
          $ref: '#/components/responses/ApiError'
  /instance/logout/{instance}:
    delete:
      operationId: logout
      tags: [Instances]
      summary: Log out an instance
      parameters:
        - $ref: '#/components/parameters/InstanceName'
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse'
        default:
          $ref: '#/components/responses/ApiError'
  /instance/delete/{instance}:
    delete:
      operationId: delete_instance
      tags: [Instances]
      summary: Delete an instance by name
      parameters:
        - $ref: '#/components/parameters/InstanceName'
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse'
        default:
          $ref: '#/components/responses/ApiError'
  /message/sendText/{instance}:
    post:
      operationId: send_text
      tags: [Messages]
      summary: Send text or a link preview
      parameters:
        - $ref: '#/components/parameters/InstanceName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendTextRequest'
      responses:
        '201':
          $ref: '#/components/responses/ApiResponse'
        default:
          $ref: '#/components/responses/ApiError'
  /message/sendMedia/{instance}:
    post:
      operationId: send_media
      tags: [Messages]
      summary: Send media by URL or base64
      parameters:
        - $ref: '#/components/parameters/InstanceName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMediaRequest'
      responses:
        '201':
          $ref: '#/components/responses/ApiResponse'
        default:
          $ref: '#/components/responses/ApiError'
  /message/sendLocation/{instance}:
    post:
      operationId: send_location
      tags: [Messages]
      summary: Send a location
      parameters:
        - $ref: '#/components/parameters/InstanceName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendLocationRequest'
      responses:
        '201':
          $ref: '#/components/responses/ApiResponse'
        default:
          $ref: '#/components/responses/ApiError'
  /message/sendContact/{instance}:
    post:
      operationId: send_contact
      tags: [Messages]
      summary: Send a contact card
      parameters:
        - $ref: '#/components/parameters/InstanceName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendContactRequest'
      responses:
        '201':
          $ref: '#/components/responses/ApiResponse'
        default:
          $ref: '#/components/responses/ApiError'
  /message/sendSticker/{instance}:
    post:
      operationId: send_sticker
      tags: [Messages]
      summary: Send a sticker
      parameters:
        - $ref: '#/components/parameters/InstanceName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendStickerRequest'
      responses:
        '201':
          $ref: '#/components/responses/ApiResponse'
        default:
          $ref: '#/components/responses/ApiError'
  /message/sendPoll/{instance}:
    post:
      operationId: send_poll
      tags: [Messages]
      summary: Send a poll
      parameters:
        - $ref: '#/components/parameters/InstanceName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendPollRequest'
      responses:
        '201':
          $ref: '#/components/responses/ApiResponse'
        default:
          $ref: '#/components/responses/ApiError'
  /message/sendReaction/{instance}:
    post:
      operationId: react
      tags: [Messages]
      summary: React to a message
      parameters:
        - $ref: '#/components/parameters/InstanceName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReactionRequest'
      responses:
        '201':
          $ref: '#/components/responses/ApiResponse'
        default:
          $ref: '#/components/responses/ApiError'
  /chat/updateMessage/{instance}:
    post:
      operationId: edit_message
      tags: [Chats]
      summary: Edit a sent message
      parameters:
        - $ref: '#/components/parameters/InstanceName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMessageRequest'
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse'
        default:
          $ref: '#/components/responses/ApiError'
  /chat/deleteMessageForEveryone/{instance}:
    delete:
      operationId: delete_message
      tags: [Chats]
      summary: Delete a message for everyone
      parameters:
        - $ref: '#/components/parameters/InstanceName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteMessageRequest'
      responses:
        '201':
          $ref: '#/components/responses/ApiResponse'
        default:
          $ref: '#/components/responses/ApiError'
  /chat/markMessageAsRead/{instance}:
    post:
      operationId: mark_read
      tags: [Chats]
      summary: Mark messages as read
      parameters:
        - $ref: '#/components/parameters/InstanceName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkReadRequest'
      responses:
        '201':
          $ref: '#/components/responses/ApiResponse'
        default:
          $ref: '#/components/responses/ApiError'
  /chat/findStatusMessage/{instance}:
    post:
      operationId: message_status
      tags: [Chats]
      summary: Find delivery updates for a message
      parameters:
        - $ref: '#/components/parameters/InstanceName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FindStatusRequest'
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse'
        default:
          $ref: '#/components/responses/ApiError'
  /chat/sendPresence/{instance}:
    post:
      operationId: set_presence
      tags: [Chats]
      summary: Set chat presence
      parameters:
        - $ref: '#/components/parameters/InstanceName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetPresenceRequest'
      responses:
        '201':
          $ref: '#/components/responses/ApiResponse'
        default:
          $ref: '#/components/responses/ApiError'
components:
  securitySchemes:
    EvolutionApiKey:
      type: apiKey
      in: header
      name: apikey
      description: Evolution API key; configure as a sensitive credential
  parameters:
    InstanceName:
      name: instance
      in: path
      required: true
      description: Evolution API instance name
      schema:
        type: string
  responses:
    ApiResponse:
      description: Response returned by Evolution API
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/JsonObject'
    ApiError:
      description: Evolution API error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/JsonObject'
  schemas:
    JsonObject:
      type: object
      additionalProperties: true
    SendOptions:
      type: object
      properties:
        delay:
          type: integer
        quoted:
          type: object
          description: Evolution API quoted message with key and message
          additionalProperties: true
        everyOne:
          type: boolean
        mentioned:
          type: array
          items:
            type: string
        linkPreview:
          type: boolean
    CreateInstanceRequest:
      type: object
      required: [instanceName, integration]
      properties:
        instanceName:
          type: string
        token:
          type: string
        integration:
          type: string
          default: WHATSAPP-BAILEYS
        qrcode:
          type: boolean
        number:
          type: string
    SendTextRequest:
      allOf:
        - $ref: '#/components/schemas/SendOptions'
        - type: object
          required: [number, text]
          properties:
            number:
              type: string
              description: Phone number in digits without the WhatsApp JID suffix
            text:
              type: string
    SendMediaRequest:
      allOf:
        - $ref: '#/components/schemas/SendOptions'
        - type: object
          required: [number, media, mediatype]
          properties:
            number:
              type: string
            media:
              type: string
              description: Media URL or base64 data
            mediatype:
              type: string
              enum: [image, video, audio, document]
            mimetype:
              type: string
            caption:
              type: string
            fileName:
              type: string
    SendLocationRequest:
      allOf:
        - $ref: '#/components/schemas/SendOptions'
        - type: object
          required: [number, latitude, longitude, name, address]
          properties:
            number:
              type: string
            latitude:
              type: number
              format: double
            longitude:
              type: number
              format: double
            name:
              type: string
            address:
              type: string
    SendContactRequest:
      allOf:
        - $ref: '#/components/schemas/SendOptions'
        - type: object
          required: [number, contact]
          properties:
            number:
              type: string
            contact:
              type: array
              items:
                type: object
                required: [fullName, wuid, phoneNumber]
                properties:
                  fullName:
                    type: string
                  wuid:
                    type: string
                    pattern: "^[0-9]+$"
                  phoneNumber:
                    type: string
                  organization:
                    type: string
                  email:
                    type: string
                  url:
                    type: string
    SendStickerRequest:
      allOf:
        - $ref: '#/components/schemas/SendOptions'
        - type: object
          required: [number, sticker]
          properties:
            number:
              type: string
            sticker:
              type: string
    SendPollRequest:
      allOf:
        - $ref: '#/components/schemas/SendOptions'
        - type: object
          required: [number, name, selectableCount, values]
          properties:
            number:
              type: string
            name:
              type: string
            selectableCount:
              type: integer
              minimum: 1
            values:
              type: array
              minItems: 2
              items:
                type: string
    MessageKey:
      type: object
      required: [id, fromMe, remoteJid]
      properties:
        id:
          type: string
        fromMe:
          type: boolean
        remoteJid:
          type: string
        participant:
          type: string
    ReactionRequest:
      type: object
      required: [key, reaction]
      properties:
        key:
          $ref: '#/components/schemas/MessageKey'
        reaction:
          type: string
    UpdateMessageRequest:
      type: object
      required: [number, key, text]
      properties:
        number:
          type: string
        key:
          $ref: '#/components/schemas/MessageKey'
        text:
          type: string
    DeleteMessageRequest:
      type: object
      required: [id, fromMe, remoteJid]
      properties:
        id:
          type: string
        fromMe:
          type: boolean
        remoteJid:
          type: string
        participant:
          type: string
    MarkReadRequest:
      type: object
      required: [readMessages]
      properties:
        readMessages:
          type: array
          items:
            $ref: '#/components/schemas/MessageKey'
    FindStatusRequest:
      type: object
      required: [where]
      properties:
        where:
          type: object
          required: [keyId]
          properties:
            keyId:
              type: string
    SetPresenceRequest:
      type: object
      required: [number, presence, delay]
      properties:
        number:
          type: string
        presence:
          type: string
          enum: [composing, recording]
        delay:
          type: integer
          default: 1000

