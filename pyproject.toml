[project]
name = "evolution-go-mcp"
version = "0.1.0"
description = "MCP server exposing Evolution Go REST API operations as tools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp>=1.9,<2"]

[project.scripts]
evolution-go-mcp = "evolution_go_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evolution_go_mcp"]
